name: Desktop installers
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      WINDOWS_CERT_PFX:
        required: false
      WINDOWS_CERT_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Read release version
        shell: bash
        run: echo "DIKDIK_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_ENV"
      - run: python -m pip install ".[desktop]" "pyinstaller>=6.22,<7"
      - if: runner.os == 'Linux'
        run: python -m pip install PySide6 qtpy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libpulse0 apparmor xvfb
          python -m playwright install-deps chromium
      - run: python scripts/build_desktop.py
      - name: Prepare Windows code signing
        id: signing
        # Never on pull requests: their code must not run next to the certificate.
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX -or -not $env:CERT_PASSWORD) {
            Write-Output "::warning::WINDOWS_CERT_PFX/WINDOWS_CERT_PASSWORD are not set: Windows builds are unsigned and show 'Unknown publisher'."
            "enabled=false" >> $env:GITHUB_OUTPUT; exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "dikdik-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found on this runner" }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
          "enabled=true" >> $env:GITHUB_OUTPUT
      - name: Sign Dikdik.exe
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $env:SIGNING_PFX /p $env:CERT_PASSWORD /d Dikdik "dist/desktop/Dikdik/Dikdik.exe"
          if ($LASTEXITCODE) { throw "signing Dikdik.exe failed" }
          & $env:SIGNTOOL verify /pa "dist/desktop/Dikdik/Dikdik.exe"
          if ($LASTEXITCODE) { throw "Dikdik.exe signature did not verify" }
      - name: Smoke-test frozen desktop
        if: runner.os != 'Linux'
        run: python scripts/smoke_desktop.py
      - name: Smoke-test frozen desktop under Xvfb
        if: runner.os == 'Linux'
        run: |
          browser="$(find "$PWD/dist/desktop/Dikdik/browser" -name chrome-headless-shell -type f -print -quit)"
          test -n "$browser"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile dikdik-ci-browser "%s" flags=(unconfined) {\n  userns,\n}\n' "$browser" > build/dikdik-ci-browser
          sudo apparmor_parser -r build/dikdik-ci-browser
          xvfb-run -a python scripts/smoke_desktop.py
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $arguments = @("/DAppVersion=$env:DIKDIK_VERSION")
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            # Inno Setup signs the setup and the uninstaller it embeds; $f is the file to sign.
            $arguments += "/DSign=1"
            $arguments += "/Sdikdiksign=`"$env:SIGNTOOL`" sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f `"$env:SIGNING_PFX`" /p $env:CERT_PASSWORD /d Dikdik `$f"
          }
          & $iscc @arguments scripts/desktop-installer.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            Get-ChildItem dist/installers/*.exe | ForEach-Object {
              & $env:SIGNTOOL verify /pa $_.FullName
              if ($LASTEXITCODE) { throw "$($_.Name) signature did not verify" }
            }
          }
      - name: Remove the signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: if ($env:SIGNING_PFX) { Remove-Item -Force -ErrorAction SilentlyContinue $env:SIGNING_PFX }
      - if: runner.os == 'macOS'
        run: |
          mkdir -p dist/installers build/dmg
          cp -R dist/desktop/Dikdik.app build/dmg/
          ln -s /Applications build/dmg/Applications
          # Hosted macOS runners intermittently report "Resource busy" while the system still
          # scans the freshly built bundle; the same command succeeds a little later.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname Dikdik -srcfolder build/dmg -ov -format UDZO "dist/installers/Dikdik-${DIKDIK_VERSION}-macOS-$(uname -m).dmg" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "hdiutil create failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
      - if: runner.os == 'Linux'
        run: |
          mkdir -p build/deb/opt/dikdik build/deb/DEBIAN build/deb/usr/share/applications build/deb/usr/share/icons/hicolor/512x512/apps dist/installers
          cp -R dist/desktop/Dikdik/. build/deb/opt/dikdik/
          mkdir -p build/deb/etc/apparmor.d
          cp scripts/dikdik-browser.apparmor build/deb/etc/apparmor.d/dikdik-browser
          cp scripts/debian-postinst build/deb/DEBIAN/postinst
          cp scripts/debian-prerm build/deb/DEBIAN/prerm
          chmod 755 build/deb/DEBIAN/postinst build/deb/DEBIAN/prerm
          printf 'Package: dikdik\nVersion: %s\nArchitecture: amd64\nMaintainer: Dikdik\nDepends: libegl1, libgl1, libxcb-cursor0, libxkbcommon0, libxkbcommon-x11-0, libxcb-icccm4, libxcb-keysyms1, libxcb-shape0, libxcb-xkb1, libpulse0, libnss3, libnspr4, libatk1.0-0t64, libatk-bridge2.0-0t64, libatspi2.0-0t64, libcups2t64, libdrm2, libxcomposite1, libxdamage1, libxfixes3, libxrandr2, libgbm1, libasound2t64, libpango-1.0-0, libcairo2, dbus-user-session, apparmor, zenity\nDescription: Dikdik desktop coding workspace\n' "$DIKDIK_VERSION" > build/deb/DEBIAN/control
          cp dikdik/web/icon.png build/deb/usr/share/icons/hicolor/512x512/apps/dikdik.png
          printf '[Desktop Entry]\nType=Application\nName=Dikdik\nExec=/opt/dikdik/Dikdik\nIcon=dikdik\nTerminal=false\nCategories=Development;\n' > build/deb/usr/share/applications/dikdik.desktop
          dpkg-deb --build --root-owner-group build/deb "dist/installers/Dikdik-${DIKDIK_VERSION}-Linux-amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Dikdik-${{ matrix.os }}
          path: dist/installers/*
          if-no-files-found: error
