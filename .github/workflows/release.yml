name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: python -m unittest discover -s tests -v
      - run: bun run typecheck:web
      - run: bun run test:web
      - run: bun run build:web
      - run: git diff --exit-code -- dikdik/web/app.js

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-release.txt
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Validate archives and tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            python scripts/check_release.py dist --tag "$RELEASE_TAG"
            test -f "docs/releases/$RELEASE_TAG.md"
          else
            python scripts/check_release.py dist
          fi
      - name: Install and smoke-test wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/dikdik-smoke"
          "$RUNNER_TEMP/dikdik-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dikdik-smoke/bin/dikdik" --version
          "$RUNNER_TEMP/dikdik-smoke/bin/python" -c "from dikdik.repository import INDEXER; assert INDEXER == 'python', INDEXER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "Release already exists; preserving its published assets."
            exit 0
          fi
          flags=()
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Dikdik $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" "${flags[@]}"
