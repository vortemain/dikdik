<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-do</h1>
    <label for="new-todo" class="sr-only">New task</label>
    <input id="new-todo" placeholder="What needs doing?" autocomplete="off" autofocus>
    <ul id="todo-list"></ul>
    <p id="count">0 items left</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
